# Install this file as .github/workflows/research-eval.yml in the private evaluation repository.
# Open a private issue titled [GO single] with exactly one public https:// URL in its body
# to investigate one chosen operator without editing the saved three-operator corpus.
name: GO private research evaluation
on:
  workflow_dispatch:
    inputs:
      website:
        description: 'Optional single public operator URL'
        required: false
        type: string
  issues:
    types: [opened]
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: go-research-eval
  cancel-in-progress: false
jobs:
  investigate:
    if: github.actor == 'markus23franks-lab' && (github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[GO research]') || startsWith(github.event.issue.title, '[GO single]') || startsWith(github.event.issue.title, '[GO pilot]') || startsWith(github.event.issue.title, '[GO provider]') || startsWith(github.event.issue.title, '[GO moab]') || startsWith(github.event.issue.title, '[GO replay]'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out private evaluation configuration
        uses: actions/checkout@v4
      - name: Verify fixed GO commit
        id: target
        shell: bash
        run: |
          ref="$(cat go-ref.txt)"
          if [[ ! "$ref" =~ ^[a-f0-9]{40}$ ]]; then
            echo 'go-ref.txt must contain a full verified GO commit SHA' >&2
            exit 1
          fi
          echo "sha=$ref" >> "$GITHUB_OUTPUT"
      - name: Check out public GO source at verified commit
        uses: actions/checkout@v4
        with:
          repository: markus23franks-lab/tour-operator-growth-template
          ref: ${{ steps.target.outputs.sha }}
          path: go
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify provider configuration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          test -n "$OPENAI_API_KEY" || { echo 'OPENAI_API_KEY missing'; exit 1; }
          test -n "$SERPAPI_KEY" || { echo 'SERPAPI_KEY missing'; exit 1; }
      - name: Post run link to triggering issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "Research run: https://github.com/$REPO/actions/runs/$RUN_ID"
      - name: Prepare single-operator corpus
        if: (github.event_name == 'issues' && startsWith(github.event.issue.title, '[GO single]')) || (github.event_name == 'workflow_dispatch' && inputs.website != '')
        env:
          GO_OPERATOR_URL: ${{ github.event_name == 'issues' && github.event.issue.body || inputs.website }}
        run: node go/scripts/prepare-single-operator-corpus.mjs "$RUNNER_TEMP/single-operator.json"
      - name: Probe search provider without OpenAI
        if: github.event_name == 'issues' && startsWith(github.event.issue.title, '[GO provider]')
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: node go/scripts/serpapi-location-probe.mjs "$RUNNER_TEMP/go-research.json"
      - name: Investigate bounded public corpus
        if: github.event_name != 'issues' || (!startsWith(github.event.issue.title, '[GO provider]') && !startsWith(github.event.issue.title, '[GO replay]'))
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          CORPUS_PATH: ${{ github.event_name == 'issues' && startsWith(github.event.issue.title, '[GO pilot]') && 'pilot-corpus.json' || github.event_name == 'issues' && startsWith(github.event.issue.title, '[GO moab]') && 'moab-corpus.json' || 'corpus.json' }}
        run: |
          if test -f "$RUNNER_TEMP/single-operator.json"; then CORPUS_PATH="$RUNNER_TEMP/single-operator.json"; fi
          node go/scripts/investigation-corpus.mjs local "$CORPUS_PATH" "$RUNNER_TEMP/go-research.json"
      - name: Replay commercial synthesis against saved private evidence
        if: github.event_name == 'issues' && startsWith(github.event.issue.title, '[GO replay]')
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GO_ALLOW_PAID_SYNTHESIS: '1'
        run: |
          mkdir -p "$RUNNER_TEMP/source"
          gh run download 35939338749 --repo "$GITHUB_REPOSITORY" --name go-research-35939338749 --dir "$RUNNER_TEMP/source"
          node go/scripts/replay-commercial-synthesis.mjs "$RUNNER_TEMP/source/go-research.json" "$RUNNER_TEMP/go-research.json"
      - name: Preserve private evidence for Builder review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-research-${{ github.run_id }}
          path: ${{ runner.temp }}/go-research.json
          if-no-files-found: ignore
          retention-days: 7
