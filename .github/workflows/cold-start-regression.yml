name: Cold-start regression

on:
  push:
    branches:
      - 'builder/build-055-cold-start-intelligence-v1'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cold-start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Build 055 JavaScript syntax
        run: |
          node --check js/cold-start-intelligence-v3.js
          node --check js/cold-start-judgment-v1.js
          node --check js/zero-input-operator-flow.js
          node --check js/opportunity-brain.js
          node --check js/operator-opportunity-brief.js
          node --check js/opportunity-brain-ui.js
          node --check js/discovery-harness.js
          node --check js/operator-analyzer.js
          node --check js/pricing-intelligence.js
          node --check js/trust-intelligence.js
          node --check js/conversion-intelligence.js
          node --check js/competitive-intelligence.js
          node --check js/positioning-intelligence.js
          node --check js/positioning-comparison.js
          node --check js/business-dossier.js
      - name: Run cold-start product-family regression
        run: node scripts/cold-start-regression.mjs
      - name: Run dedicated research-plan regression
        run: node scripts/research-plan-regression.mjs
      - name: Run competitive-intelligence regression
        run: node scripts/competitive-intelligence-regression.mjs
      - name: Run trust and pricing evidence-integrity regression
        run: node scripts/research-integrity-regression.mjs
      - name: Run positioning-intelligence regression
        run: node scripts/positioning-regression.mjs
      - name: Run business-dossier regression
        run: node scripts/business-dossier-regression.mjs
      - name: Run operator presentation-integrity regression
        run: node scripts/presentation-integrity-regression.mjs

      - name: Run Opportunity Brain evidence-integrity regression
        run: node scripts/opportunity-brain-regression.mjs
      - name: Run Analyzer portfolio-judgment regression
        run: node scripts/analyzer-judgment-regression.mjs
      - name: Run zero-input handoff regression
        run: node scripts/zero-input-handoff-regression.mjs
