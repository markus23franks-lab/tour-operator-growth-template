name: Cold-start regression

on:
  push:
    branches:
      - 'builder/build-055-cold-start-intelligence-v1'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cold-start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Build 055 JavaScript syntax
        run: |
          node --check js/cold-start-intelligence-v3.js
          node --check js/cold-start-judgment-v1.js
          node --check js/zero-input-operator-flow.js
          node --check js/opportunity-brain.js
          node --check js/operator-opportunity-brief.js
          node --check js/opportunity-brain-ui.js
          node --check js/discovery-harness.js
          node --check js/operator-analyzer.js
          node --check js/pricing-intelligence.js
          node --check js/trust-intelligence.js
          node --check js/conversion-intelligence.js
          node --check js/competitive-intelligence.js
          node --check js/positioning-intelligence.js
          node --check js/positioning-comparison.js
          node --check js/offer-evidence.js
          node --check js/business-dossier.js
          node --check js/offer-comparison.js
          node --check js/booking-journey-intelligence.js
          node --check js/product-architecture-intelligence.js
          node --check js/action-plan-intelligence.js
          node --check js/presentation-gate.js
          node --check netlify/functions/investigation-lab.mjs
          node --check netlify/functions/lib/investigation-core.mjs
          node --check netlify/functions/lib/serpapi-investigation-adapter.mjs
          node --check netlify/functions/lib/first-party-investigation-adapter.mjs
          node --check netlify/functions/lib/research-model-adapter.mjs
          node --check netlify/functions/lib/commercial-synthesis.mjs
          node --check netlify/functions/lib/follow-up-executor.mjs
          node --check netlify/functions/lib/competitor-investigation-adapter.mjs
      - name: Run all offline regressions
        run: |
          set -e
          for script in scripts/*-regression.mjs; do
            node "$script"
          done
