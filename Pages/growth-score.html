<!DOCTYPE html>
<html lang="en">

<head>
    <title>Growth Operator Score</title>
    <link rel="stylesheet" href="../styles.css">
</head>

<body>

<section class="hero">

    <div class="hero-content">

        <p class="eyebrow">
            FREE TOUR OPERATOR GROWTH SCORE
        </p>

        <h1>
            Discover How Many Direct Bookings You're Missing
        </h1>

        <p class="hero-text">
            Answer a few simple questions and receive your personalized Growth Score in under 3 minutes.
        </p>

        <div class="progress">
            Step 1 of 6
        </div>

        <form>

            <label>Business Name</label>
            <input type="text">

            <label>Website URL</label>
            <input type="text">

            <label>Booking Software</label>
            <select>
                <option>Peek Pro</option>
                <option>FareHarbor</option>
                <option>Rezdy</option>
                <option>Checkfront</option>
                <option>Other</option>
            </select>

            <button type="submit">
                Continue →
            </button>

        </form>

        <div id="results" style="display:none; margin-top:40px;">

            <h2>Your Growth Score</h2>

            <h1 id="score-number">85</h1>

            <p id="score-message">
                You're missing opportunities to generate more direct bookings.
            </p>

        </div>

    </div>

</section>

<script src="../js/assessment.js"></script>

</body>

</html>
